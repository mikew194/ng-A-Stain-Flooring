<mat-card class="home-card">
  <mat-card-header>
    <mat-card-title class="card-title">Welcome to A Stain Flooring</mat-card-title>
  </mat-card-header>

  <mat-card-content class="card-content">
    <img src="[https://placehold.co/600x300/333/FFD700?text=A+Stain+Flooring](https://placehold.co/600x300/333/FFD700?text=A+Stain+Flooring)" alt="A Stain Flooring Logo" class="company-image">
    <p class="company-slogan">
      Your trusted partner for custom floor staining and unique floor designs.
      We specialize in transforming your floors into works of art,
      offering a wide range of colors and custom image options.
    </p>
  </mat-card-content>

  <mat-card-actions class="card-actions">
    <button mat-raised-button color="primary" (click)="goToCustomerPage()">
      Get Your Free Estimate
    </button>
  </mat-card-actions>
</mat-card>
